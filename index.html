/* =====================================================
   ENGLISH PRONUNCIATION
===================================================== */

function speak(text){

if(!("speechSynthesis" in window)){

alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");

return;
}

speechSynthesis.cancel();

const u = new SpeechSynthesisUtterance(text);

u.lang = "en-US";
u.rate = .82;
u.pitch = 1;

const voices = speechSynthesis.getVoices();

const voice =
voices.find(v => v.lang === "en-US") ||
voices.find(v => v.lang.startsWith("en"));

if(voice){
u.voice = voice;
}

speechSynthesis.speak(u);
}


/* =====================================================

===================================================== */

function parseWord(item){

return {

word:item[0],
fa:item[1],
definition:item[2]

};

}


/* =====================================================

===================================================== */

function updateCard(){

current = parseWord(data[index]);

document.getElementById("word").textContent =
current.word;

document.getElementById("meaning").textContent =
current.fa;

document.getElementById("definition").textContent =
current.definition;

document.getElementById("counter").textContent =
(index + 1) + " / " + data.length;

document.getElementById("cardProgress").style.width =
((index + 1) / data.length * 100) + "%";


const tags = [];

if(/\bSYN\b/i.test(current.definition)){

tags.push(
'<span class="tag">SYN · Synonym</span>'
);

}

if(/\bANT\b/i.test(current.definition)){

tags.push(
'<span class="tag">ANT · Antonym</span>'
);

}

document.getElementById("tags").innerHTML =
tags.join("");


document.getElementById("meaning")
.classList.toggle("hidden", !revealed);

}


/* =====================================================
   NEXT / PREVIOUS
===================================================== */

function next(){

index = (index + 1) % data.length;

revealed = true;

updateCard();

}


function previous(){

index =
(index - 1 + data.length) % data.length;

revealed = true;

updateCard();

}


/* =====================================================

revealed = !revealed;

document.getElementById("meaning")

def.className = "definition";

def.textContent = x[2];


content.append(en, fa, def);


const btn =
document.createElement("button");

btn.className = "small-btn";

btn.textContent = "🔊";

btn.onclick = () => speak(x[0]);


item.append(content, btn);

list.appendChild(item);

});


if(!filtered.length){

list.textContent =
"واژه‌ای پیدا نشد.";

}

}


/* =====================================================
   FOUR OPTION QUIZ
===================================================== */

let quizItems = [];
let quizIndex = 0;
let quizScore = 0;
let quizCurrent = null;
let answered = false;
let quizStarted = false;


function shuffle(arr){

return [...arr].sort(() =>
Math.random() - .5
);

}


function startQuiz(){

quizItems = shuffle(data);

quizIndex = 0;

quizScore = 0;

quizStarted = true;

document.getElementById("quizArea")
.classList.remove("hidden");

document.getElementById("quizResult")
.classList.add("hidden");

makeQuestion();

}


/* =====================================================
   MAKE QUESTION
===================================================== */

function makeQuestion(){

answered = false;

quizCurrent =
quizItems[quizIndex];


document.getElementById("questionWord")
.textContent =
quizCurrent[0];


document.getElementById("questionNumber")
.textContent =
`سؤال ${quizIndex + 1} از ${quizItems.length}`;


document.getElementById("quizProgress")
.style.width =
(quizIndex / quizItems.length * 100)
+ "%";


document.getElementById("feedback")
.textContent = "";


const nextBtn =
document.getElementById("nextQuestion");

nextBtn.disabled = true;


const wrong =
shuffle(
data.filter(x =>
x[0] !== quizCurrent[0]
)
).slice(0,3);


const choices =
shuffle([quizCurrent, ...wrong]);


const options =
document.getElementById("options");

options.innerHTML = "";


choices.forEach(x => {

const b =
document.createElement("button");

b.className = "option";

b.textContent = x[1];

b.onclick = () =>
answer(b,x);

options.appendChild(b);

});

}


/* =====================================================
   ANSWER
===================================================== */

function answer(btn,x){

if(answered){
return;
}

answered = true;


document.querySelectorAll(".option")
.forEach(b => {

if(b.textContent === quizCurrent[1]){

b.classList.add("correct");

}

});


if(x[0] === quizCurrent[0]){

quizScore++;

score++;

document.getElementById("score")
.textContent = score;

document.getElementById("feedback")
.textContent =
"✓ عالی! پاسخ درست است.";

}else{

btn.classList.add("wrong");

document.getElementById("feedback")
.textContent =
"پاسخ درست: " + quizCurrent[1];

}


document.getElementById("nextQuestion")
.disabled = false;

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

if(!answered){
return;
}

quizIndex++;


if(quizIndex >= quizItems.length){

document.getElementById("quizArea")
.classList.add("hidden");

document.getElementById("quizResult")
.classList.remove("hidden");


document.getElementById("resultText")
.textContent =
`شما ${quizScore} پاسخ درست از ${quizItems.length} سؤال داشتید.`;

document.getElementById("quizProgress")
.style.width = "100%";

}else{

makeQuestion();

}

}


/* =====================================================
   INITIALIZATION
===================================================== */

updateCard();


if("speechSynthesis" in window){

speechSynthesis.getVoices();

}

</script>
